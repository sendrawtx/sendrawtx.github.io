<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Трансляция Экранa</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 { color: #24292e; margin-bottom: 10px; }
        p { color: #586069; }
        .section {
            margin: 25px 0;
            padding: 20px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            background: #fafbfc;
        }
        .btn {
            background-color: #2ea44f;
            color: white;
            border: 1px solid rgba(27,31,35,0.15);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2c974b; }
        .btn-secondary { background-color: #0366d6; }
        .btn-secondary:hover { background-color: #0255b3; }
        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            width: 250px;
            margin-right: 10px;
        }
        video {
            width: 100%;
            max-height: 450px;
            background: #000;
            border-radius: 6px;
            margin-top: 15px;
        }
        #peer-id-display {
            font-weight: bold;
            color: #0366d6;
            background: #e1f5fe;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 10px;
        }
        .status { font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Трансляция экрана (P2P WebRTC)</h1>
    <p>Этот сайт работает без серверов напрямую между браузерами через PeerJS.</p>

    <!-- Секция Стримера -->
    <div class="section">
        <h2>1. Я хочу транслировать экран</h2>
        <button class="btn" id="start-stream-btn">Запустить трансляцию</button>
        <div id="streamer-info" style="display:none;">
            <p>Передайте этот ID зрителю:</p>
            <div id="peer-id-display">Загрузка ID...</div>
        </div>
    </div>

    <!-- Секция Зрителя -->
    <div class="section">
        <h2>2. Я хочу смотреть трансляцию</h2>
        <input type="text" id="peer-id-input" placeholder="Введите ID стримера">
        <button class="btn btn-secondary" id="connect-btn">Подключиться</button>
    </div>

    <!-- Видеоплеер -->
    <div id="video-container" style="display:none;">
        <div class="status" id="connection-status">Статус: Готов</div>
        <video id="remote-video" autoplay playsinline controls muted></video>
    </div>
</div>

<script>
    let peer = null;
    let localStream = null;

    // Инициализация PeerJS при необходимости
    function initPeer(callback) {
        if (!peer) {
            peer = new Peer();
            peer.on('open', (id) => {
                callback(id);
            });
            peer.on('error', (err) => {
                console.error(err);
                alert('Ошибка PeerJS: ' + err.type);
            });
        } else {
            callback(peer.id);
        }
    }

    // ЛОГИКА СТРИМЕРА
    document.getElementById('start-stream-btn').addEventListener('click', async () => {
        try {
            // Запрашиваем захват экрана
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: { cursor: "always" },
                audio: true
            });

            document.getElementById('video-container').style.display = 'block';
            const videoElement = document.getElementById('remote-video');
            videoElement.srcObject = localStream;
            videoElement.muted = true; // Стримеру не нужно слышать себя эхом
            document.getElementById('connection-status').innerText = "Статус: Показ собственного экрана";

            // Инициализируем Peer, чтобы принимать звонки
            initPeer((id) => {
                document.getElementById('streamer-info').style.display = 'block';
                document.getElementById('peer-id-display').innerText = id;
            });

            // Обработка входящего подключения от зрителя
            peer.on('call', (call) => {
                // Отвечаем на звонок, отправляя поток экрана
                call.answer(localStream);
                document.getElementById('connection-status').innerText = "Статус: Зритель подключился!";
            });

            // Если стример нажал "Остановить показ" в браузере
            localStream.getVideoTracks()[0].onended = () => {
                stopStream();
            };

        } catch (err) {
            console.error("Ошибка захвата экрана:", err);
            alert("Не удалось захватить экран. Убедитесь, что дали разрешение.");
        }
    });

    // ЛОГИКА ЗРИТЕЛЯ
    document.getElementById('connect-btn').addEventListener('click', () => {
        const remoteId = document.getElementById('peer-id-input').value.trim();
        if (!remoteId) {
            alert("Пожалуйста, введите ID стримера.");
            return;
        }

        document.getElementById('connection-status').innerText = "Подключение...";
        document.getElementById('video-container').style.display = 'block';

        initPeer((myId) => {
            // Зритель "звонит" стримеру, передавая пустой поток (или просто инициализирует вызов)
            // Чтобы PeerJS сработал корректно, создадим пустой медиапоток
            const fakeStream = new MediaStream();
            const call = peer.call(remoteId, fakeStream);

            call.on('stream', (remoteStream) => {
                document.getElementById('connection-status').innerText = "Статус: Трансляция активна";
                const videoElement = document.getElementById('remote-video');
                videoElement.srcObject = remoteStream;
                videoElement.muted = false; // Зритель должен слышать звук
            });

            call.on('close', () => {
                alert("Трансляция завершена стримером.");
                stopStream();
            });
        });
    });

    function stopStream() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('video-container').style.display = 'none';
        document.getElementById('streamer-info').style.display = 'none';
        document.getElementById('connection-status').innerText = "Статус: Готов";
    }
</script>
</body>
</html>
