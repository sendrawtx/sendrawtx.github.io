<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр видео</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background-color: #000000;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="video-container">
    <h1>Воспроизведение private_tx.mp4</h1>
    
    <!-- Встроенный HTML5 плеер -->
    <video controls preload="metadata" playsinline>
        <source src="/private_tx.mp4" type="video/mp4">
        Ваш браузер не поддерживает встроенные видеоплееры. 
        Вы можете <a href="/private_tx.mp4" style="color: #3498db;">скачать файл напрямую</a>.
    </video>
</div>

</body>
</html>
